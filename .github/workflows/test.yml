name: Worker checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile worker
        run: python -m py_compile worker.py
      - name: Run policy tests
        run: python -m unittest discover -s tests -v
