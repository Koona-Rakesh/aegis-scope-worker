name: Passive scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-scope-passive-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CONTROL_PLANE_URL: https://aegis-scope.rakesh181236.chatgpt.site
      SCANNER_CALLBACK_TOKEN: ${{ secrets.SCANNER_CALLBACK_TOKEN }}
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
      ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
      RUN_ONCE: "true"
      MAX_SCAN_SECONDS: "3600"
      POLL_SECONDS: "2"
    steps:
      - name: Check out scanner
        uses: actions/checkout@v4

      - name: Build isolated scanner
        run: docker build --pull --tag aegis-scope-scanner:run .

      - name: Claim one authorized passive job
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --memory 2g \
            --cpus 1.0 \
            --stop-timeout 120 \
            -e CONTROL_PLANE_URL \
            -e SCANNER_CALLBACK_TOKEN \
            -e SITE_DISPATCH_TOKEN \
            -e ZAP_API_KEY \
            -e RUN_ONCE \
            -e MAX_SCAN_SECONDS \
            -e POLL_SECONDS \
            aegis-scope-scanner:run
